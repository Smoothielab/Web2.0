<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<!-- Optimizaciones para evitar zoom y gestionar mejor el tacto en webOS -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Smoothie Lab - Menú</title>

<style>
/* Forzar pantalla completa real y evitar barras de desplazamiento */
html, body { 
    margin:0; 
    padding:0; 
    height:100%; 
    width: 100%;
    overflow:hidden; 
    background:black; 
    font-family: sans-serif; 
    overscroll-behavior: none; /* Evita efectos de rebote */
}

video#bg-video { 
    position:absolute; 
    top:0; 
    left:0; 
    width:100%; 
    height:100%; 
    object-fit:cover; 
    z-index:0; 
}

/* Capa del menú (oculta inicialmente) */
#menu-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.98); /* Fondo casi negro sólido para mejor lectura */
    z-index: 10;
    display: none; /* MUY IMPORTANTE: Oculto por defecto */
    flex-direction: column;
    /* Habilitar scroll nativo suave */
    overflow-y: auto; 
    -webkit-overflow-scrolling: touch;
    /* Padding inferior para que el contenido no se corte bajo el botón */
    padding-bottom: 140px; 
}

/* Estilo para las imágenes del menú */
.menu-img {
    display: block;
    margin: 30px auto 10px auto; /* Margen superior, centrado, margen inferior entre imágenes */
    max-width: 92%; /* Un poco más de margen a los lados para que se vea que es desplazable */
    height: auto; /* Mantiene proporción */
    border-radius: 12px;
    /* Sutil sombra para separar la imagen del fondo oscuro */
    box-shadow: 0 0 20px rgba(255,255,255,0.15);
    /* Mejora de renderizado para evitar dientes de sierra al escalar */
    image-rendering: -webkit-optimize-contrast;
}

/* Botón flotante para CERRAR MANEUALMENTE */
#close-button {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%); /* Centrado horizontalmente perfecto */
    padding: 25px 60px; /* Botón muy grande para facilitar el toque táctil */
    font-size: 2.2rem;
    background: rgba(255,255,255,0.98);
    color: black;
    border: none;
    border-radius: 60px;
    cursor: pointer;
    z-index: 11; /* Por encima de las imágenes */
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    font-weight: bold;
    /* Feedback visual al tocar */
    transition: transform 0.15s, background-color 0.15s;
    -webkit-tap-highlight-color: transparent; /* Quita el destello azul al tocar en webOS */
}
#close-button:active { 
    transform: translateX(-50%) scale(0.97); 
    background: rgba(255,255,255,0.8);
}

/* Botón grande inicial para ABRIR */
#open-button { 
    position:fixed; 
    bottom:50px; 
    right:50px; 
    padding:45px 80px; 
    font-size:3.5rem; 
    border:none; 
    border-radius:30px; 
    background-color:rgba(255,255,255,0.98); 
    color: black;
    font-weight: bold;
    cursor:pointer; 
    /* Animación de llamada de atención *suave* para no sobrecargar el motor de la TV */
    animation:pulse-tle 2s infinite; 
    z-index:5; 
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    transition: transform 0.15s;
    -webkit-tap-highlight-color: transparent;
}
#open-button:active { transform:scale(0.97); }

@keyframes pulse-tle { 
    0% { box-shadow: 0 15px 40px rgba(0,0,0,0.6), scale(1); } 
    50% { box-shadow: 0 15px 50px rgba(0,0,0,0.8), scale(1.03); } 
    100% { box-shadow: 0 15px 40px rgba(0,0,0,0.6), scale(1); } 
}
</style>
</head>
<body>

<!-- Video de fondo -->
<video id="bg-video" autoplay muted loop playsinline preload="auto">
  <source src="smoothie-lab-video.mp4" type="video/mp4">
</video>

<!-- Capa del menú (Contiene las 2 imágenes) -->
<div id="menu-overlay">
    <!-- IMAGEN 1: REEMPLAZA CON TU LIGA DIRECTA RAW DE GITHUB -->
    <img src="https://raw.githubusercontent.com/Smoothielab/Web2.0/main/menu_pagina1.jpg" alt="Menú Página 1" class="menu-img" id="img1">
    
    <!-- IMAGEN 2: REEMPLAZA CON TU LIGA DIRECTA RAW DE GITHUB -->
    <img src="https://raw.githubusercontent.com/Smoothielab/Web2.0/main/menu_pagina2.jpg" alt="Menú Página 2" class="menu-img" id="img2">
    
    <!-- Botón de cierre manual -->
    <button id="close-button" onclick="closeMenuManual()">X Cerrar Menú</button>
</div>

<!-- Botón inicial para abrir -->
<button id="open-button" style="display: none;">Cargando...</button>

<script>
const openBtn = document.getElementById('open-button');
const menuOverlay = document.getElementById('menu-overlay');
const bgVideo = document.getElementById('bg-video');
const img1 = document.getElementById('img1');
const img2 = document.getElementById('img2');

// Bandera para saber si las imágenes ya terminaron de cargar
let imagesLoadedCount = 0;
const totalImages = 2;

// --- Función genérica para manejar la carga de imágenes ---
function onImageLoad() {
    imagesLoadedCount++;
    // Solo mostramos el botón cuando ambas imágenes estén en la caché de la TV
    if (imagesLoadedCount === totalImages) {
        openBtn.innerText = "Ver Menu";
        openBtn.style.display = 'block';
        console.log("Menú precargado correctamente.");
    }
}

// --- Función genérica para manejar errores de carga ---
function onImageError(elementName) {
    console.error("Error al precargar la imagen: " + elementName);
    // Aunque falle una, intentamos mostrar el botón igual, aunque la imagen se vea rota
    imagesLoadedCount++;
    if (imagesLoadedCount === totalImages) {
        openBtn.innerText = "Ver Menu";
        openBtn.style.display = 'block';
    }
}

// --- Iniciar precarga al cargar la página ---
window.addEventListener('load', () => {
    // Asignamos los eventos de carga y error ANTES de asignar el src
    img1.onload = onImageLoad;
    img1.onerror = () => onImageError('Página 1');
    // Forzamos la carga estableciendo el src
    img1.src = "https://raw.githubusercontent.com/Smoothielab/Web2.0/main/menu_pagina1.jpg";

    img2.onload = onImageLoad;
    img2.onerror = () => onImageError('Página 2');
    img2.src = "https://raw.githubusercontent.com/Smoothielab/Web2.0/main/menu_pagina2.jpg";
});


// --- Abrir Menú (Instantáneo porque ya está precargado) ---
function openMenu() {
    // Mostrar capa
    menuOverlay.style.display = 'flex';
    // Ocultar botón abrir
    openBtn.style.display = 'none';
    // Pausar video para liberar recursos de la GPU
    bgVideo.pause();
    // Asegurar que el scroll esté arriba
    menuOverlay.scrollTop = 0;
}

// --- Cerrar Menú Manualmente ---
function closeMenuManual() {
    // Ocultar capa
    menuOverlay.style.display = 'none';
    // Mostrar botón abrir
    openBtn.style.display = 'block';
    // Reanudar video
    bgVideo.play();
}

// Evento click/toque botón ABRIR
openBtn.addEventListener('click', openMenu);

</script>

</body>
</html>
