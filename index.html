<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Smoothie Lab - Menú</title>

<style>
html, body { 
    margin:0; 
    padding:0; 
    height:100%; 
    width: 100%;
    overflow:hidden; 
    background:black; 
    font-family: sans-serif; 
    overscroll-behavior: none;
}

/* Contenedor del video para poder destruirlo y crearlo */
#video-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: black;
}

video#bg-video { 
    width:100%; 
    height:100%; 
    object-fit:cover; 
}

/* Capa del menú (oculta inicialmente) */
#menu-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.98);
    z-index: 10;
    display: none;
    flex-direction: column;
    overflow-y: auto; 
    -webkit-overflow-scrolling: touch;
    padding-bottom: 140px; 
}

.menu-img {
    display: block;
    margin: 30px auto 10px auto;
    max-width: 92%; 
    height: auto; 
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(255,255,255,0.15);
    image-rendering: -webkit-optimize-contrast;
}

#close-button {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    padding: 25px 60px;
    font-size: 2.2rem;
    background: rgba(255,255,255,0.98);
    color: black;
    border: none;
    border-radius: 60px;
    cursor: pointer;
    z-index: 11;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    font-weight: bold;
    transition: transform 0.15s, background-color 0.15s;
    -webkit-tap-highlight-color: transparent;
}
#close-button:active { 
    transform: translateX(-50%) scale(0.97); 
    background: rgba(255,255,255,0.8);
}

#open-button { 
    position:fixed; 
    bottom:50px; 
    right:50px; 
    padding:45px 80px; 
    font-size:3.5rem; 
    border:none; 
    border-radius:30px; 
    background-color:rgba(255,255,255,0.98); 
    color: black;
    font-weight: bold;
    cursor:pointer; 
    animation:pulse-tle 2s infinite; 
    z-index:5; 
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    transition: transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    display: none; /* Oculto hasta que el DOM esté listo */
}
#open-button:active { transform:scale(0.97); }

@keyframes pulse-tle { 
    0% { box-shadow: 0 15px 40px rgba(0,0,0,0.6), scale(1); } 
    50% { box-shadow: 0 15px 50px rgba(0,0,0,0.8), scale(1.03); } 
    100% { box-shadow: 0 15px 40px rgba(0,0,0,0.6), scale(1); } 
}
</style>
</head>
<body>

<!-- Contenedor donde vive el video -->
<div id="video-container">
    <!-- Usaremos JavaScript para insertar el video aquí -->
</div>

<!-- Capa del menú -->
<div id="menu-overlay">
    <img alt="Menú Página 1" class="menu-img" id="img1">
    <img alt="Menú Página 2" class="menu-img" id="img2">
    <button id="close-button" onclick="closeMenuManual()">X Cerrar Menú</button>
</div>

<!-- Botón inicial -->
<button id="open-button">Ver Menu</button>

<script>
const openBtn = document.getElementById('open-button');
const menuOverlay = document.getElementById('menu-overlay');
const videoContainer = document.getElementById('video-container');
const img1 = document.getElementById('img1');
const img2 = document.getElementById('img2');

// Rutas a tus imágenes optimizadas en GitHub
const urlImg1 = "https://raw.githubusercontent.com/Smoothielab/Web2.0/main/menu_pagina1.jpg";
const urlImg2 = "https://raw.githubusercontent.com/Smoothielab/Web2.0/main/menu_pagina2.jpg";

let imagesLoadedCount = 0;
const totalImages = 2;

// --- Función para crear el video (Bucle inicial) ---
function loadVideo() {
    videoContainer.innerHTML = ''; // Limpia por si acaso
    const video = document.createElement('video');
    video.id = 'bg-video';
    video.autoplay = true;
    video.loop = true;
    video.muted = true; // Obligatorio para autoplay en TVs
    video.playsInline = true;
    video.src = 'smoothie-lab-video.mp4'; // Asegúrate de que este archivo esté en la misma carpeta
    videoContainer.appendChild(video);
}

// --- Precarga de imágenes (sin mostrarlas) ---
function preloadImages() {
    img1.onload = () => { imagesLoadedCount++; checkReady(); };
    img1.src = urlImg1;
    
    img2.onload = () => { imagesLoadedCount++; checkReady(); };
    img2.src = urlImg2;
}

// --- Habilitar botón cuando todo esté listo ---
function checkReady() {
    if (imagesLoadedCount === totalImages) {
        openBtn.style.display = 'block';
        openBtn.innerText = "Ver Menu";
    }
}

// --- INICIO: Cargar video y precargar imágenes ---
window.addEventListener('load', () => {
    loadVideo(); // Ponemos el video a correr
    preloadImages(); // Precargamos el menú en caché
});


// --- Abrir Menú: DESTRUYE EL VIDEO ---
function openMenu() {
    // 1. Muestra el menú instantáneamente
    menuOverlay.style.display = 'flex';
    openBtn.style.display = 'none';
    menuOverlay.scrollTop = 0;
    
    // 2. ELIMINA EL VIDEO DEL NAVEGADOR. Esto libera toda la RAM y GPU de golpe.
    videoContainer.innerHTML = ''; 
}

// --- Cerrar Menú: RECREA EL VIDEO ---
function closeMenuManual() {
    // 1. Oculta el menú
    menuOverlay.style.display = 'none';
    openBtn.style.display = 'block';
    
    // 2. VUELVE A INSERTAR EL VIDEO Y HACER AUTOPLAY.
    loadVideo(); 
}

openBtn.addEventListener('click', openMenu);

</script>

</body>
</html>
