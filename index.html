<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Smoothie Lab - Menú</title>

<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:black; font-family: sans-serif; }
video#bg-video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:0; }

/* Capa del menú (oculta inicialmente) */
#menu-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95); /* Fondo oscuro */
    z-index: 10;
    display: none; /* Oculto por defecto */
    flex-direction: column;
    overflow-y: auto; /* Permite hacer scroll vertical si el menú es largo */
    -webkit-overflow-scrolling: touch;
    padding-bottom: 120px; /* Espacio extra abajo para el botón flotante */
}

/* Estilo para las imágenes del menú */
.menu-img {
    display: block;
    margin: 20px auto; /* Centrado */
    max-width: 95%; /* Ocupa casi todo el ancho */
    height: auto; /* Mantiene la proporción de la imagen */
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(255,255,255,0.2);
}

/* Botón flotante para CERRAR */
#close-button {
    position: fixed;
    bottom: 30px;
    left: 30px;
    padding: 25px 50px; /* Botón grande para fácil toque */
    font-size: 2rem;
    background: rgba(255,255,255,0.95);
    color: black;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    z-index: 11;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    font-weight: bold;
    transition: transform 0.2s;
}
#close-button:active { transform: scale(0.95); }

/* Botón grande inicial para ABRIR */
#open-button { 
    position:fixed; 
    bottom:40px; 
    right:40px; 
    padding:40px 70px; 
    font-size:3rem; 
    border:none; 
    border-radius:25px; 
    background-color:rgba(255,255,255,0.95); 
    color: black;
    font-weight: bold;
    cursor:pointer; 
    animation:pulse 1.5s infinite; 
    z-index:5; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: transform 0.2s;
}
#open-button:active { transform: scale(0.95); }

@keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.06);} 100%{transform:scale(1);} }
</style>
</head>
<body>

<!-- Video de fondo corriendo en bucle -->
<video id="bg-video" autoplay muted loop playsinline>
  <source src="smoothie-lab-video.mp4" type="video/mp4" />
</video>

<!-- Capa del menú (Contiene las 2 imágenes) -->
<div id="menu-overlay">
    <!-- REEMPLAZA CON TUS ENLACES REALES DE GITHUB -->
    <img src="https://raw.githubusercontent.com/Smoothielab/Web2.0/main/menu_pagina1.jpg" alt="Menú Página 1" class="menu-img">
    <img src="https://raw.githubusercontent.com/Smoothielab/Web2.0/main/menu_pagina2.jpg" alt="Menú Página 2" class="menu-img">
    
    <!-- Botón de cierre manual -->
    <button id="close-button" onclick="closeMenuManual()">X Cerrar Menú</button>
</div>

<!-- Botón inicial para abrir -->
<button id="open-button">Ver Menu</button>

<script>
const openBtn = document.getElementById('open-button');
const menuOverlay = document.getElementById('menu-overlay');
const bgVideo = document.getElementById('bg-video');

// --- Abrir Menú ---
function openMenu() {
    // Muestra la capa de imágenes
    menuOverlay.style.display = 'flex';
    // Oculta el botón de abrir
    openBtn.style.display = 'none';
    // Pausa el video para ahorrar recursos de la TV
    bgVideo.pause();
    // Asegura que el menú empiece desde arriba
    menuOverlay.scrollTop = 0;
}

// --- Cerrar Menú Manualmente ---
function closeMenuManual() {
    // Oculta la capa de imágenes
    menuOverlay.style.display = 'none';
    // Vuelve a mostrar el botón de abrir
    openBtn.style.display = 'block';
    // Reanuda el video en bucle
    bgVideo.play();
}

// Evento click/toque botón ABRIR
openBtn.addEventListener('click', openMenu);

// Nota: El botón de cerrar ya tiene el onclick="closeMenuManual()" en el HTML.
</script>

</body>
</html>
