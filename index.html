<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smoothie Lab - Menú</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:black; font-family: sans-serif; }
video#bg-video { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:0; }

/* Botón grande optimizado para pantalla táctil de la StanbyME */
button.order-button { 
    position:fixed; 
    bottom:40px; 
    right:40px; 
    padding:40px 70px; 
    font-size:3rem; 
    border:none; 
    border-radius:25px; 
    background-color:rgba(255,255,255,0.95); 
    color: black;
    font-weight: bold;
    cursor:pointer; 
    animation:pulse 1.5s infinite; 
    z-index:3; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition:transform 0.3s; 
}
button.order-button:active { transform:scale(0.95); }
@keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.06);} 100%{transform:scale(1);} }
</style>
</head>
<body>

<!-- Video de fondo corriendo en bucle fluido -->
<video id="bg-video" autoplay muted loop playsinline>
  <source src="smoothie-lab-video.mp4" type="video/mp4" />
  Tu navegador no soporta video HTML5.
</video>

<!-- Botón táctil para ver el menú -->
<button class="order-button" id="order-button">Ver Menu</button>

<script>
const orderButton = document.getElementById('order-button');
let inactivityTimer;

// Enlace directo a tu PDF en GitHub
const pdfUrl = "https://raw.githubusercontent.com/Smoothielab/Web2.0/main/MENU2026.pdf";

// --- Función al hacer click en la StanbyME ---
function openMenu() {
    // Abre el PDF en una pestaña nueva del navegador de webOS
    window.open(pdfUrl, '_blank');
    
    // Inicia el temporizador de inactividad de 240 segundos (4 minutos)
    startInactivityTimer();
}

// --- Recargar la página para volver al video inicial tras la inactividad ---
function startInactivityTimer() {
    clearTimeout(inactivityTimer);
    inactivityTimer = setTimeout(() => {
        // Recarga la página por completo, lo que mata cualquier pestaña colgada 
        // y devuelve la StanbyME al video reproduciéndose en bucle.
        window.location.reload();
    }, 240000); 
}

// --- Reiniciar el conteo si alguien toca la pantalla o interactúa ---
['mousemove', 'touchstart', 'click', 'keydown'].forEach(evt => {
    window.addEventListener(evt, () => {
        if (inactivityTimer) {
            startInactivityTimer();
        }
    });
});

// Evento táctil/click principal
orderButton.addEventListener('click', openMenu);
</script>

</body>
</html>
